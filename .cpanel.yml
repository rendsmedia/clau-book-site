---
# cPanel Git Version Control deployment for the CLAU book site.
# LAUNCH branch: copies /site to the williammatovu.com document root.
# Search engines stay blocked until site/.htaccess and the noindex meta are removed.
deployment:
  tasks:
    - export DEPLOYPATH=/home/rends/public_html/williammatovu.com/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R site/. $DEPLOYPATH
