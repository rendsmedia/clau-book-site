---
# cPanel Git Version Control deployment for the CLAU book site.
# STAGING: copies /site to the book.rendsmedia.com subdomain folder.
# LAUNCH: change DEPLOYPATH to the williammatovu.com document root.
deployment:
  tasks:
    - export DEPLOYPATH=/home/rends/public_html/book.rendsmedia.com/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R site/. $DEPLOYPATH
    - /bin/bash -c 'V=$(git rev-parse --short HEAD 2>/dev/null || date +%s); /bin/sed -i -E "s/\.(css|js)\?v=[A-Za-z0-9]+/.\1?v=$V/g" "$DEPLOYPATH"*.html'
