---
# cPanel Git Version Control deployment for williammatovu.com.
# Copies /site to williammatovu.com (cPanel account william1) on "Deploy HEAD Commit".
# Then stamps the commit code into CSS/JS links so browsers load the newest version.
deployment:
  tasks:
    - export DEPLOYPATH=/home/william1/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R site/. $DEPLOYPATH
    - /bin/bash -c 'V=$(git rev-parse --short HEAD 2>/dev/null || date +%s); /bin/sed -i -E "s/\.(css|js)\?v=[A-Za-z0-9]+/.\1?v=$V/g" "$DEPLOYPATH"*.html'
